<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة غياب الطلاب</title>
<meta name="description" content="رصد غياب الطلاب اليومي وطباعة التقارير اليومية والأسبوعية والشهرية">
<meta name="theme-color" content="#18181b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="غياب الطلاب">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa; --card:#ffffff; --ink:#09090b; --muted:#71717a; --accent:#18181b; --accent-fg:#fafafa;
  --accent-soft:#f4f4f5; --border:#e4e4e7; --border-2:#d4d4d8; --ring:#a1a1aa;
  --good:#16a34a; --good-soft:#f0fdf4; --good-line:#bbf7d0;
  --bad:#dc2626; --bad-soft:#fef2f2; --bad-line:#fecaca;
  --warn:#d97706; --warn-soft:#fffbeb; --warn-line:#fde68a; --warn-ink:#78350f;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.03);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090b; --card:#18181b; --ink:#fafafa; --muted:#a1a1aa; --accent:#fafafa; --accent-fg:#18181b;
    --accent-soft:#27272a; --border:#27272a; --border-2:#3f3f46; --ring:#71717a;
    --good:#4ade80; --good-soft:#0f2417; --good-line:#14532d; --bad:#f87171; --bad-soft:#2a1212; --bad-line:#7f1d1d;
    --warn:#fbbf24; --warn-soft:#271d08; --warn-line:#78350f; --warn-ink:#fde68a; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090b; --card:#18181b; --ink:#fafafa; --muted:#a1a1aa; --accent:#fafafa; --accent-fg:#18181b;
  --accent-soft:#27272a; --border:#27272a; --border-2:#3f3f46; --ring:#71717a;
  --good:#4ade80; --good-soft:#0f2417; --good-line:#14532d; --bad:#f87171; --bad-soft:#2a1212; --bad-line:#7f1d1d;
  --warn:#fbbf24; --warn-soft:#271d08; --warn-line:#78350f; --warn-ink:#fde68a; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ overflow-x:hidden; }
body{ overflow-x:clip; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.55; }
h1,h2,h3,h4{ margin:0; }
button,input,select{ font-family:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--ring); outline-offset:2px; }
.grow{ flex:1 1 auto; min-width:0; }
svg{ display:block; flex:none; }

/* shell */
.topbar{ display:none; align-items:center; gap:10px; padding:10px 14px; background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:25; }
.topbar .hamburger{ background:none; border:1px solid var(--border); border-radius:6px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
.topbar .tb-title{ font-weight:600; font-size:13.5px; flex:1; }
.overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:29; }
.shell{ display:flex; min-height:100vh; align-items:stretch; }
.rail{ width:240px; flex-shrink:0; background:var(--card); border-left:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
.brand{ display:flex; align-items:center; gap:10px; margin-bottom:22px; padding:0 6px; }
.brand-ic{ width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-fg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.brand h4{ font-weight:600; font-size:14px; letter-spacing:-.01em; }
.sync{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.sync::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--good); }
.sync.local::before{ background:var(--warn); }
.nav{ display:flex; flex-direction:column; gap:1px; }
.nav button{ position:relative; display:flex; align-items:center; gap:9px; background:none; border:0; padding:8px 10px; border-radius:6px; font-size:13.5px; color:var(--muted); text-align:right; transition:background-color .12s,color .12s; }
.nav button svg{ opacity:.65; }
.nav button:hover{ background:var(--accent-soft); color:var(--ink); }
.nav button.on{ background:var(--accent-soft); color:var(--ink); font-weight:600; }
.nav button.on svg, .nav button:hover svg{ opacity:1; }
.nav button.on::before{ content:""; position:absolute; right:-14px; top:50%; transform:translateY(-50%); width:3px; height:16px; border-radius:3px; background:var(--accent); }
.rail-foot{ margin-top:auto; }
.note-card{ font-size:11.5px; color:var(--muted); padding:10px 6px 0; border-top:1px solid var(--border); line-height:1.7; }
.note-card .btn{ margin-top:8px; width:100%; }
.copy{ text-align:center; font-size:11.5px; color:var(--muted); padding:14px 6px 0; margin-top:12px; border-top:1px solid var(--border); }
.main{ flex:1; min-width:0; padding:28px 32px 60px; }
.inner{ max-width:1060px; }
.phead{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.phead .school{ font-size:17px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
.phead h1{ font-size:22px; font-weight:600; letter-spacing:-.02em; margin:2px 0 0; }
.phead .sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
.view{ display:flex; flex-direction:column; gap:14px; }
.loading{ display:inline-flex; align-items:center; gap:8px; padding:8px 2px; font-size:13px; color:var(--muted); }
.loading::before{ content:""; width:14px; height:14px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--ink); animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* primitives */
.card, .bar, .panel{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
.bar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:7px 14px; font-size:13px; font-weight:500; color:var(--ink); transition:background-color .12s,border-color .12s,opacity .12s; white-space:nowrap; }
.btn:hover{ background:var(--accent-soft); border-color:var(--border-2); }
.btn.primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); padding:8px 16px; font-size:13.5px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
.btn.primary:hover{ opacity:.88; background:var(--accent); }
.btn.primary:active{ transform:scale(.98); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn.danger{ color:var(--bad); }
.btn.danger:hover{ background:var(--bad-soft); border-color:var(--bad-line); }
.btn.danger.armed{ background:var(--bad); color:#fff; border-color:var(--bad); }
.input{ padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13.5px; background:var(--card); color:var(--ink); outline:none; min-height:36px; transition:border-color .12s,box-shadow .12s; }
.input:focus{ border-color:var(--muted); box-shadow:0 0 0 3px rgba(113,113,122,.15); }
.day-label{ background:var(--card); border:1px solid var(--border); border-radius:6px; padding:7px 18px; font-weight:500; font-size:13.5px; flex:1; text-align:center; min-width:180px; }
.day-label small{ color:var(--muted); font-weight:400; margin-inline-start:6px; }
.pill{ background:var(--card); border:1px solid var(--border); border-radius:999px; padding:5px 13px; font-size:12.5px; font-weight:500; }
.hij{ display:none; }
.tag{ display:inline-flex; align-items:center; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; white-space:nowrap; border:1px solid transparent; }
.tag.ok{ background:var(--good-soft); color:var(--good); border-color:var(--good-line); }
.tag.warn{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line); }
.tag.bad{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }
.tag.mute{ background:var(--accent-soft); color:var(--muted); border-color:var(--border); }
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ background:var(--card); border:1px solid var(--border); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:500; color:var(--muted); }
.chip:hover{ border-color:var(--border-2); }
.chip.on{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.notice, .banner{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 12px; border:1px solid var(--warn-line); border-inline-start:4px solid var(--warn); border-radius:10px; background:var(--warn-soft); color:var(--warn-ink); font-size:12.5px; }
.banner{ margin-bottom:12px; }
.banner span{ flex:1 1 300px; line-height:1.6; }
.banner button{ background:var(--accent); color:var(--accent-fg); border:1px solid var(--accent); border-radius:6px; padding:6px 12px; font-size:12.5px; font-weight:500; }
.banner button.later{ background:transparent; color:var(--warn-ink); border-color:var(--warn-line); }
.sec-h{ display:flex; align-items:center; gap:8px; margin:8px 0 -2px; }
.sec-h h3{ font-size:14.5px; font-weight:700; }
.sec-h small{ font-size:11.5px; color:var(--muted); }
.sec-h::after{ content:""; flex:1; height:1px; background:var(--border); }

/* kpis */
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
.kpi{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:0 1px 2px rgba(16,24,40,.04); display:flex; flex-direction:column; transition:box-shadow .15s,transform .15s; }
.kpi:hover{ box-shadow:0 4px 12px rgba(16,24,40,.08); transform:translateY(-1px); }
.kpi .l{ font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:7px; display:flex; align-items:center; gap:6px; }
.kpi .ki{ width:22px; height:22px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--ink); }
.kpi .v{ font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.2; }
.kpi .v.t{ font-size:15px; font-weight:700; line-height:1.5; }
.kpi .s{ font-size:11.5px; color:var(--muted); margin-top:4px; }
.kpi.good{ border-color:var(--good-line); background:linear-gradient(180deg,var(--good-soft),var(--card) 60%); }
.kpi.bad{ border-color:var(--bad-line); background:linear-gradient(180deg,var(--bad-soft),var(--card) 60%); }
.kpi.warn{ border-color:var(--warn-line); background:linear-gradient(180deg,var(--warn-soft),var(--card) 60%); }
.kpi.good .s{ color:var(--good); } .kpi.bad .s{ color:var(--bad); }

/* entry tiles */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
.tile{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); transition:border-color .12s,background-color .12s; }
.tile.has{ border-color:var(--warn-line); background:linear-gradient(180deg,var(--warn-soft),var(--card) 70%); }
.tile.hi{ border-color:var(--bad-line); background:linear-gradient(180deg,var(--bad-soft),var(--card) 70%); }
.tile-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.tile-name{ font-weight:600; font-size:14px; }
.tile-sub{ font-size:11.5px; color:var(--muted); white-space:nowrap; }
.stepper{ display:flex; align-items:center; justify-content:space-between; }
.stepper button{ width:34px; height:34px; border-radius:6px; border:1px solid var(--border); background:var(--card); font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--ink); }
.stepper button:hover{ background:var(--accent-soft); border-color:var(--border-2); }
.stepper input{ width:80px; border:0; background:none; text-align:center; font-size:28px; font-weight:800; letter-spacing:-.02em; padding:0; font-variant-numeric:tabular-nums; -moz-appearance:textfield; }
.stepper input:focus{ outline:none; }
.stepper input:focus-visible{ outline:2px solid var(--ring); border-radius:6px; }
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.tile-foot{ display:flex; justify-content:center; }

.savebar{ position:sticky; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:15; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px 10px 12px; padding-inline-start:18px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; box-shadow:0 6px 18px rgba(0,0,0,.08); }
.tally{ display:flex; align-items:baseline; gap:8px; margin-inline-end:auto; }
.tally b{ font-size:24px; font-weight:800; letter-spacing:-.02em; }
.tally span{ font-size:12.5px; color:var(--muted); }

.recent h3{ font-size:14.5px; font-weight:700; margin:8px 0 10px; }
.rlist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px; }
.ritem{ display:flex; justify-content:space-between; align-items:center; gap:10px; text-align:start; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; }
.ritem:hover{ background:var(--accent-soft); }
.ritem span{ color:var(--muted); }
.ritem b{ font-weight:600; }
.empty{ background:var(--card); border:1px solid var(--border); border-radius:12px; text-align:center; padding:44px 16px; box-shadow:var(--shadow); }
.empty .ic{ width:48px; height:48px; border-radius:50%; background:var(--accent-soft); color:var(--ink); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
.empty h2{ font-size:15px; font-weight:600; margin-bottom:6px; }
.empty p{ color:var(--muted); font-size:13px; margin:0 auto 16px; max-width:420px; }

/* reports */
.sheet-wrap{ background:var(--accent-soft); border:1px solid var(--border); border-radius:12px; padding:20px; overflow-x:auto; }

/* settings */
.cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr)); gap:14px; }
.panel{ padding:20px 22px; }
.panel h3{ font-size:15px; font-weight:600; letter-spacing:-.01em; margin-bottom:4px; }
.panel .hint{ color:var(--muted); font-size:13px; margin:0 0 14px; }
.fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; align-items:end; }
label.f{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--muted); font-weight:500; }
.row-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }
.ctable-wrap{ overflow-x:auto; }
.ctable{ width:100%; border-collapse:collapse; font-size:13px; min-width:540px; }
.ctable th{ text-align:start; color:var(--muted); font-weight:600; font-size:11.5px; padding:8px 10px; border-bottom:1px solid var(--border); }
.ctable td{ padding:6px 10px; border-bottom:1px solid var(--border); }
.ctable tbody tr:hover{ background:var(--bg); }
.ctable .input{ padding:4px 6px; font-size:12.5px; min-height:32px; }
.ctable input.cnt{ width:90px; } .ctable input.sec{ width:70px; }
.ctable .btn{ padding:4px 10px; font-size:12px; }

.toast{ position:fixed; inset-inline:0; bottom:calc(84px + env(safe-area-inset-bottom,0px)); margin:0 auto; width:max-content; max-width:calc(100% - 32px); padding:10px 14px; border-radius:6px; font-size:13.5px; z-index:50; opacity:0; transform:translateY(6px); transition:opacity .2s,transform .2s; pointer-events:none; background:var(--good-soft); color:var(--good); border:1px solid var(--good-line); box-shadow:0 6px 18px rgba(0,0,0,.08); }
.toast.show{ opacity:1; transform:none; }
.toast.err{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }

/* register editor */
.reged{ padding:0; overflow:hidden; }
.reged-h{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--border); }
.reged-h b{ font-size:14px; }
.reged-tw{ overflow-x:auto; }
.regt{ width:100%; border-collapse:collapse; font-size:13px; min-width:820px; }
.regt th{ text-align:start; color:var(--muted); font-weight:600; font-size:11.5px; padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
.regt td{ padding:5px 6px; border-bottom:1px solid var(--border); }
.regt tr:last-child td{ border-bottom:0; }
.regt .input{ width:100%; min-height:32px; padding:4px 8px; font-size:13px; }
.regt td.n{ color:var(--muted); width:28px; text-align:center; }
.regt .n-l{ display:none; }
.seg{ display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--card); }
.seg button{ border:0; background:none; padding:5px 10px; font-size:12px; color:var(--muted); white-space:nowrap; }
.seg button + button{ border-inline-start:1px solid var(--border); }
.seg button.on[data-v="بعذر"]{ background:var(--good); color:#fff; font-weight:700; }
.seg button.on[data-v="بدون"]{ background:var(--bad); color:#fff; font-weight:700; }
.seg button.on[data-act="setterm"], .seg button.on[data-act="setgender"]{ background:var(--accent); color:var(--accent-fg); font-weight:600; }
.seg button[data-act="setterm"], .seg button[data-act="setgender"]{ padding:7px 16px; font-size:13px; }
.reged-f{ padding:10px 16px; border-top:1px solid var(--border); background:var(--bg); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.logo-prev{ width:64px; height:64px; border:1px dashed var(--border-2); border-radius:8px; display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden; color:var(--muted); font-size:11px; }
.logo-prev img{ max-width:100%; max-height:100%; }
#printArea{ display:none; }
a.btn{ text-decoration:none; }
.btn.wa{ color:#128c4a; border-color:#9fe0bb; }
.btn.wa:hover{ background:#eafaf1; }
.alerts{ background:var(--card); border:1px solid var(--warn-line); border-inline-start:4px solid var(--warn); border-radius:12px; padding:12px 16px; box-shadow:var(--shadow); }
.alerts h3{ font-size:14px; font-weight:700; margin:0 0 6px; }
.alerts ul{ margin:0; padding-inline-start:18px; font-size:13px; line-height:1.9; }
.alerts li b{ font-weight:700; }
.alerts .btn.sm{ margin-inline-start:6px; }
.updbar{ position:fixed; inset-inline:0; top:calc(12px + env(safe-area-inset-top,0px)); margin:0 auto; width:max-content; max-width:calc(100% - 24px); z-index:70; display:flex; gap:10px; align-items:center; background:var(--accent); color:var(--accent-fg); border-radius:999px; padding:8px 8px 8px 8px; padding-inline-start:18px; box-shadow:0 8px 24px rgba(0,0,0,.2); font-size:14px; }
.updbar button{ border:0; border-radius:999px; padding:6px 14px; background:var(--accent-fg); color:var(--accent); font-weight:600; }
.nmchip{ display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; background:var(--card); }
.nmchip button{ border:0; background:none; padding:6px 12px; font-size:12.5px; color:var(--muted); }
.nmchip button + button{ border-inline-start:1px solid var(--border); padding:6px 10px; }
.nmchip.on{ border-color:var(--accent); } .nmchip.on button:first-child{ color:var(--ink); font-weight:600; }
.rform{ background:var(--bg); }
.rsec{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
.rsec-h{ font-weight:700; font-size:14px; margin-bottom:10px; }
.rsec-h small{ font-weight:400; color:var(--muted); font-size:12px; margin-inline-start:6px; }
.rsn{ display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-top:6px; }
label.chk{ display:inline-flex; align-items:center; gap:7px; font-size:14px; cursor:pointer; }
label.chk input{ width:18px; height:18px; accent-color:var(--accent); margin:0; }
.rform textarea.input{ width:100%; line-height:1.8; padding:8px 10px; resize:vertical; }
.dlg-b.pv .refm{ box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 30px rgba(0,0,0,.08); }

async function sbOnLogin(user){
  const prev = lsGet('sbuid', null);
  if(prev && prev !== user.id){ wipeLocal(); lsSetRaw('sbuid', JSON.stringify(user.id)); location.reload(); return; }
  lsSetRaw('sbuid', JSON.stringify(user.id));
  sb.user = user; sb.profile = await sbLoadProfile(user); sb.booting = false; sb.msg = '';
  authRender();
  if(!profOK(sb.profile)){ sbSetStatus('off'); return; }
  if(isAdm()){ state.view = 'admin'; sbSetStatus('on'); if(state.cfg) render(); return; }
  if(state.cfg) render();
  try{ sb.dirty = JSON.parse(localStorage.getItem('absence:sbdirty') || '{}'); }catch(e){ sb.dirty = {}; }
  // اللقطة الأولى = البيانات المحلية الحالية
  SB_KINDS.forEach(k => { const v = {cfg: state.cfg, days: state.days, refs: state.refs, roster: state.roster, actions: state.actions, noorm: state.noorM}[k]; sbRowsOf(k, v).forEach(([key, d]) => { sb.snap[k + '|' + key] = JSON.stringify(d); }); });
  await sbPull(true);
  if(sb.ch) sb.client.removeChannel(sb.ch);
  sb.ch = sb.client.channel('absence-' + user.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'app_data', filter:'owner=eq.' + user.id}, pl => {
      const row = pl.eventType === 'DELETE' ? pl.old : pl.new; if(!row || !row.kind) return;
      const id = row.kind + '|' + row.key;
      if(pl.eventType !== 'DELETE' && sb.snap[id] === JSON.stringify(row.data)) return;
      sbApply(row.kind, row.key, row.data, pl.eventType === 'DELETE'); onData();
    }).subscribe();
  sbPush();
}
async function sbPull(first){
  sbSetStatus('sync');
  const {data, error} = await sb.client.from('app_data').select('kind,key,data');
  if(error){ sbSetStatus('error', error.message); return; }
  const remote = new Set();
  (data || []).forEach(r => { remote.add(r.kind + '|' + r.key); sbApply(r.kind, r.key, r.data, false); });
  // ما هو موجود محليًا وغير موجود في السحابة يُرفع (أول ربط لجهاز عليه بيانات)
  if(first && !remote.has('cfg|main') && sb.profile && sb.profile.school && state.cfg){ state.cfg.school = sb.profile.school; lsSet('cfg', state.cfg); }
  if(first) Object.keys(sb.snap).forEach(id => { if(!remote.has(id) && !sb.dirty[id]) sb.dirty[id] = 1; });
  if(state.cfg) onData();
  sbSetStatus(Object.keys(sb.dirty).length ? 'sync' : 'on');
}

  if(d.startsWith('05')) d = '966' + d.slice(1); else if(/^5\d{8}$/.test(d)) d = '966' + d;

}

function alertsHTML(){

  if(prev.length >= 2){
    const last = prev.slice(-6).reverse();

    const hits = [];

    hits.sort((a, b) => b.n - a.n);

    }
  }
  const due = studentStats().filter(s => s.due.length);
  if(due.length) items.push(`${due.length} ${g.student} بلغ حد إجراء غياب لم يُسجَّل بعد.<button class="btn sm" data-go="actions">إجراءات الغياب</button>`);
  if(prev.length >= 8){
    const tot = k => { const r = state.days[k]; return Math.max(+r.total || 0, Object.values(r.entries || {}).reduce((a, b) => a + (+b || 0), 0)); };
    const wd = parse(d0).getDay(), same = prev.filter(k => parse(k).getDay() === wd), other = prev.filter(k => parse(k).getDay() !== wd);

    }
  }
  return items.length ? `<section class="alerts"><h3>تنبيهات</h3><ul>${items.map(x => `<li>${x}</li>`).join('')}</ul></section>` : '';

async function exportXlsx(keys, label){

      const S = ((rec.students || {})[c.id] || []).filter(r => (r.name || '').trim()), v = Math.max(+((rec.entries || {})[c.id]) || 0, S.length), n = +c.count || 0;

    k(top && top.r >= HIGH ? 'bad' : '', 'أعلى فصل غيابًا', top ? esc(`${top.c.grade} ${top.c.stage} / ${top.c.section}`) : '—', top ? `${arN(top.v)} ${G().absents} · ${AR(Math.round(top.r*100))}٪` : 'لا يوجد غياب', true, 'top');
  const rec = state.days[state.entryDate];
  $('#saveBtn').disabled = !isDirty() && !!rec;
  $('#saveBtn').textContent = rec ? (isDirty() ? 'حفظ التعديلات' : 'محفوظ') : 'حفظ غياب اليوم';
  const sb = $('#sumBtn'); if(sb) sb.href = waUrl('', daySummaryText());
  $('#dirtyActs').innerHTML = isDirty() && rec ? `<button class="btn" data-act="revert">تراجع</button>` : '';
}

/* قراءة كشف أسماء نور (PDF) — نصوصه مخزنة بأرقام الحروف في خط Arial، ومقلوبة بصريًا */
const NOOR_SPECIAL = {0x2EF:'ء',0x2F0:'ـ',0x308:'ە',0x32F:'ک',0x335:'ی',0x336:'ی',0xBCC:'\uFDF2',0xBD7:' '};
function noorIsGarbled(str){ for(const ch of str){ const c = ch.codePointAt(0); if((c >= 0x2E0 && c <= 0x3FF) || c === 0xBCC || (c < 0x20 && c !== 9 && c !== 10)) return true; } return false; }
function noorDecode(str){
  if(!noorIsGarbled(str)) return str.trim();
  let out = [];
  for(const ch of str){
    const c = ch.codePointAt(0);
    if(NOOR_SPECIAL[c]) out.push(NOOR_SPECIAL[c]);
    else if(c >= 0x370 && c <= 0x3FC) out.push(String.fromCodePoint(c + 0xFB00));
    else if(c >= 3 && c < 0x62) out.push(String.fromCodePoint(c + 29));
    else out.push(ch);
  }
  // الترتيب في الملف بصري (من اليسار لليمين) فنعكسه
  let s = out.reverse().join('');
  // الأرقام اللاتينية داخل النص المقلوب تعود لترتيبها
  s = s.replace(/[0-9]+/g, m => m.split('').reverse().join(''));
  s = s.normalize('NFKC').replace(/\uFDF2|ﷲ/g, 'الله').replace(/\s+/g, ' ').trim();
  return s;
}
const NOOR_GRADES = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس'];
function noorNormGrade(t){
  const s = t.replace(/[إأآ]/g,'ا');
  const g = ['الاول','الثاني','الثالث','الرابع','الخامس','السادس'].findIndex(w => s.includes(w));
  const stage = /متوسط/.test(s) ? 'متوسط' : (/ابتدائ/.test(s) ? 'ابتدائي' : null);
  return g >= 0 && stage ? {grade: NOOR_GRADES[g], stage} : null;
}
/* pages: [[{str, x, y}]] → {classes:[{grade,stage,section,names:[]}], female:bool} */
function noorParse(pages){
  const map = new Map(); let female = null;
  pages.forEach(items => {
    const its = items.map(i => ({...i, t: noorDecode(i.str)})).filter(i => i.t);
    const lines = [];
    its.forEach(i => { let L = lines.find(l => Math.abs(l.y - i.y) < 3.5); if(!L){ L = {y:i.y, items:[]}; lines.push(L); } L.items.push(i); });
    lines.forEach(L => L.items.sort((a,b) => b.x - a.x));
    const all = its.map(i => i.t).join(' ');
    if(/الطالبات|الطالبة/.test(all)) female = true; else if(female === null && /الطلاب|الطالب/.test(all)) female = false;
    let gr = null, sec = null;
    lines.forEach(L => {
      const txt = L.items.map(i => i.t).join(' ');
      if(!gr && /الصف/.test(txt)) gr = noorNormGrade(txt.replace(/.*الصف/, ''));
      if(sec == null && /الفصل/.test(txt) && !/الدراسي/.test(txt)){ const m = txt.replace(/.*الفصل/, '').match(/\d+/); if(m) sec = +m[0]; }
    });
    if(!gr || sec == null) return;
    const key = gr.stage + '|' + gr.grade + '|' + sec;
    if(!map.has(key)) map.set(key, {...gr, section: sec, rows: []});
    const C = map.get(key);
    const nums = its.filter(i => /^\d{1,3}$/.test(i.t) && +i.t > 0 && +i.t < 200);
    if(!nums.length) return;
    // عمود التسلسل: أقصى اليمين
    const maxX = Math.max(...nums.map(n => n.x));
    const ser = nums.filter(n => Math.abs(n.x - maxX) < 20).sort((a, b) => b.y - a.y);
    if(!ser.length) return;
    const gaps = ser.slice(1).map((n, k) => ser[k].y - n.y).filter(g => g > 2).sort((a, b) => a - b);
    const h = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 16;
    const BAD = /الإدارة|الادارة|وزارة|المملكة|ابتدائية|متوسطة|ثانوية|الابتدائي|المتوسط|مدرسة|تحفيظ|تقرير|كشف|مجموع|مسلسل|تعني|الغياب|القسم|العام|الصف|الفصل|اسم الطالب|التوقيع|النظام|الشهر|عدد|[:：]/;
    const MARK = /^(ب\s*)?[غعب]$|^[غع]\s*ب$/;
    const frags = its.filter(i => /[\u0600-\u06FF]/.test(i.t) && !BAD.test(i.t) && !MARK.test(i.t) && i.x < maxX - 5);
    ser.forEach((sn, k) => {
      const top = k === 0 ? sn.y + h / 2 : (ser[k - 1].y + sn.y) / 2;
      const bot = k === ser.length - 1 ? sn.y - h / 2 : (sn.y + ser[k + 1].y) / 2;
      const parts = frags.filter(f => f.y <= top && f.y > bot).sort((a, b) => (b.y - a.y) > 2 ? 1 : (a.y - b.y) > 2 ? -1 : b.x - a.x);
      // نأخذ الأجزاء المتجاورة في عمود الاسم فقط (الأقرب لعمود التسلسل)
      if(!parts.length) return;
      const nameRight = Math.max(...parts.map(p => p.x + (p.w || 0)));
      const name = parts.filter(p => p.x > nameRight - 260).map(p => p.t).join(' ').replace(/\s+/g, ' ').trim();
      const n = +sn.t;
      if(name.split(' ').length >= 2 && !C.rows.some(r => r.n === n)) C.rows.push({n, name});
    });
  });
  const classes = [...map.values()].map(c => ({grade:c.grade, stage:c.stage, section:c.section, names: c.rows.sort((a,b) => a.n - b.n).map(r => r.name)})).filter(c => c.names.length);
  return {classes, female};
}
/* تقرير الغياب على مستوى أيام الشهر (نور) */
function noorMonthlyParse(pages){
  const out = {female:true, grade:'', section:'', month:'', year:'', school:'', students:[], dayCount:{}};
  pages.forEach(({items:raw, W}) => {
    const items = raw.map(i => ({t: noorDecode(i.str), x:i.x, y:i.y, w:i.w || 0, cx: i.x + (i.w || 0) / 2})).filter(i => i.t);
    const nums = items.filter(i => /^\d{1,2}$/.test(i.t));
    const groups = [];
    nums.forEach(i => { let g = groups.find(g => Math.abs(g.y - i.y) < 3); if(!g){ g = {y:i.y, its:[]}; groups.push(g); } g.its.push(i); });
    let hdrY = null, dayX = null;
    groups.forEach(g => { const v = g.its.map(i => +i.t); if(v.includes(30) && v.includes(1) && v.includes(15)){ hdrY = g.y; dayX = {}; g.its.forEach(i => dayX[+i.t] = i.cx); } });
    if(hdrY === null) return;
    const dxs = Object.values(dayX), colW = Math.abs(dayX[1] - dayX[2]) || 15;
    const minDayX = Math.min(...dxs) - colW, maxDayX = Math.max(...dxs) + colW;
    const find = label => { const l = items.find(i => i.t === label || i.t.startsWith(label + ' ')); if(!l) return '';
      return items.filter(i => Math.abs(i.y - l.y) < 5 && i !== l && i.x < l.x && !/^:$/.test(i.t) && i.x > l.x - 130).sort((a,b) => b.x - a.x).map(i => i.t).join(' ').replace(/^:\s*/, '').trim(); };
    if(items.some(i => i.t === 'اسم الطالب')) out.female = false;
    if(!out.grade){
      out.grade = find('الصف'); out.section = find('الفصل'); out.month = find('الشهر');
      out.year = (items.find(i => /\d{4}-\d{4}/.test(i.t)) || {}).t || '';
      out.school = (items.find(i => /ابتدائية|متوسطة|ثانوية|مدرسة|ابتدائيه/.test(i.t) && i.x > (W || 800) * 0.6) || {}).t || '';
    }
    const below0 = nums.filter(i => i.y < hdrY - 3);
    if(!below0.length) return;
    const serialX = Math.max(...below0.map(i => i.x));
    const serials = below0.filter(i => Math.abs(i.x - serialX) < 8).map(i => ({n:+i.t, y:i.y, name:[], ex:0, un:0, marks:[]}));
    if(!serials.length) return;
    const near = y => serials.reduce((a, b) => Math.abs(b.y - y) < Math.abs(a.y - y) ? b : a);
    const ys = serials.map(s => s.y).sort((a,b) => b - a);
    const rowGap = ys.length > 1 ? Math.abs(ys[0] - ys[1]) : 16;
    const below = items.filter(i => i.y < hdrY - 3 && i.y > Math.min(...ys) - rowGap * 0.75);
    const leftNums = below.filter(i => /^\d+$/.test(i.t) && i.x < minDayX);
    const xs = [...new Set(leftNums.map(i => Math.round(i.x / 5) * 5))].sort((a,b) => a - b);
    below.forEach(i => {
      const r = near(i.y); if(Math.abs(r.y - i.y) > rowGap * 0.75) return;
      if(/^\d+$/.test(i.t) && i.x < minDayX){ const col = Math.round(i.x / 5) * 5; if(col === xs[0]) r.un = +i.t; else r.ex = +i.t; }
      else if(i.cx >= minDayX && i.cx <= maxDayX && /[غع]/.test(i.t) && i.t.length <= 4){
        let best = null, bd = 1e9; for(const d in dayX){ const dd = Math.abs(dayX[d] - i.cx); if(dd < bd){ bd = dd; best = +d; } }
        r.marks.push({day:best, un:/ب/.test(i.t)});
      } else if(i.x + i.w > maxDayX && /[\u0621-\u064A]/.test(i.t) && !/^(ب\s*)?[غع]$|^[غع]\s*ب$/.test(i.t) && i.x < serialX - 4){ r.name.push(i); }
    });
    serials.forEach(r => {
      if(out.students.some(s => s.n === r.n)) return;
      const name = r.name.sort((a,b) => (b.y - a.y) > 2 ? 1 : (a.y - b.y) > 2 ? -1 : b.x - a.x).map(i => i.t).join(' ').replace(/\s+/g, ' ').trim();
      out.students.push({n:r.n, name, ex:r.ex, un:r.un, marks:r.marks.sort((a,b) => a.day - b.day)});
    });
  });
  out.students.sort((a,b) => a.n - b.n);
  out.students.forEach(s => s.marks.forEach(m => out.dayCount[m.day] = (out.dayCount[m.day] || 0) + 1));
  return out;
}

function parsePasted(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    const cells = line.split(/\t|,|؛|;/).map(x => x.trim()).filter(Boolean);
    let phone = '', name = '';
    cells.forEach(cl => {
      const d = cl.replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/[^\d+]/g, '');
      if(/^(\+?966|0)?5\d{8}$/.test(d)) phone = d;
      else if(/[\u0600-\u06FF]/.test(cl) && cl.length > name.length) name = cl;
    });
    name = name.replace(/^[\s\d٠-٩\-\.\)\(]+/, '').replace(/\s+/g, ' ').trim();
    if(name.length >= 2) out.push({name, phone});
  });
  return out;
}

const guardianOf = s => ((state.actions[s.key] || {}).guardian) || s.name.trim().split(/\s+/).slice(1).join(' ');

const femTxt = t => !G().f ? t : t.replace(/طالب منتسب/g, 'طالبة منتسبة').replace(/الطالب/g, 'الطالبة').replace(/حُوّلت/g, 'حُوّلتِ');

function studentStats(){
  const from = state.cfg.actFrom || '';
  const keys = Object.keys(state.days).filter(k => !from || k >= from).sort();
  const map = new Map();
  keys.forEach((k, di) => {
    const S = state.days[k].students || {};
    Object.entries(S).forEach(([cid, rows]) => rows.forEach(r => {
      const nm = (r.name || '').trim(); if(!nm) return;
      const key = cid + '|' + nm;
      let o = map.get(key);
      if(!o){ o = {key, cid, name:nm, unexc:0, exc:0, streak:0, maxStreak:0, last:-9, dates:[], phone:''}; map.set(key, o); }
      if(r.phone) o.phone = r.phone;
      if(r.type === 'بعذر'){ o.exc++; return; }
      o.unexc++; o.streak = o.last === di - 1 ? o.streak + 1 : 1; o.last = di; o.maxStreak = Math.max(o.maxStreak, o.streak); o.dates.push(k);
    }));
  });
  return [...map.values()].map(o => {
    const reached = ACT_LEVELS.filter(L => L.pct ? o.unexc >= pctDays(L.pct) : (o.maxStreak >= 3 || o.unexc >= 5));
    const done = state.actions[o.key] || {};
    const due = reached.filter(L => !done[L.id]);
    const c = state.cfg.classes.find(x => x.id === o.cid);
    return {...o, cls: c, reached, due, top: reached[reached.length - 1] || null};
  });
}

function rangeDates(r){
  if(r.type === 'daily') return [parse(r.date)];
  if(r.type === 'weekly'){ const d = parse(r.date), sun = addDays(d, -d.getDay()); return [0,1,2,3,4].map(i => addDays(sun, i)); }
  const [y,m] = r.month.split('-').map(Number), out = [];
  for(let i = 1; i <= new Date(y, m, 0).getDate(); i++) out.push(new Date(y, m-1, i));
  return out;
}

const NM_COLORS = ['#1d9bf0','#f2b705','#4cd964','#ef4444','#9b5de5','#00b8a9','#fb7185','#64748b','#84cc16'];

function nmClasses(){
  const inc = (state.noorM.files || []).filter(f => f.include !== false && f.data && f.data.students && f.data.students.length);
  const C = inc.map(f => {
    const d = f.data, g = noorNormGrade(d.grade || '') || {grade: d.grade || '', stage: ''}, n = parseInt(d.section, 10);
    const m = g.stage && n ? matchClass(g.stage, g.grade, n) : null;
    const sec = m ? m.section : (n ? (SEC_L[n-1] || String(n)) : (d.section || ''));
    const ex = d.students.reduce((a, s) => a + (+s.ex || 0), 0), un = d.students.reduce((a, s) => a + (+s.un || 0), 0);
    return {id:f.id, grade:g.grade, stage:g.stage, sec, full:`${g.grade} ${g.stage} / ${sec}`, short:`${g.grade} / ${sec}`,
      s:d.students.length, a:d.students.filter(s => s.ex + s.un > 0).length, ex, un, d:ex + un, students:d.students, dayCount:d.dayCount || {}, school:d.school, month:d.month, year:d.year};
  });
  const multi = new Set(C.map(c => c.stage)).size > 1;
  if(multi) C.forEach(c => c.short = `${c.grade} ${c.stage === 'متوسط' ? 'م' : 'ب'} / ${c.sec}`);
  const si = st => STAGES.findIndex(x => x.k === st);
  C.sort((a, b) => si(a.stage) - si(b.stage) || GRADES.indexOf(a.grade) - GRADES.indexOf(b.grade) || String(a.sec).localeCompare(String(b.sec), 'ar'));

  </div>
  <div class="bar"><label class="f" style="flex-direction:row;align-items:center;gap:8px">الكشف<select class="input" id="stuMin">${[[1,'يوم فأكثر'],[2,'يومان فأكثر'],[3,'٣ أيام فأكثر'],[5,'٥ أيام فأكثر']].map(([v, t]) => `<option value="${v}" ${(state.stuMin || 1) === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label><label class="chk"><input type="checkbox" id="stuUn" ${state.stuUn ? 'checked' : ''}> بدون عذر فقط</label></div>

function buildSheet(){
  const r = state.rpt, cfg = state.cfg, list = classes();
  const dates = rangeDates(r), keys = dates.map(iso), rec = keys.filter(k => state.days[k]);
  const recN = rec.length;
  const title = {daily:'التقرير اليومي لغياب ', weekly:'التقرير الأسبوعي لغياب ', monthly:'التقرير الشهري لغياب '}[r.type] + G().students;
  const a = dates[0], b = dates[dates.length-1];
  let sub;
  if(r.type === 'daily') sub = `<b class="sch">${esc(cfg.school)}</b> — ${dayName(a)} ${dmy(a)} (${hijriFull(a)})`;
  else if(r.type === 'weekly') sub = `<b class="sch">${esc(cfg.school)}</b> — الأسبوع من ${dmy(a)} إلى ${dmy(b)} (${hijriRange(a,b)}) · ${recN} يوم مرصود`;
  else sub = `<b class="sch">${esc(cfg.school)}</b> — ${gMonth(a)} ${a.getFullYear()} (${hijriRange(a,b)}) — من ${dmy(a)} إلى ${dmy(b)} · ${recN} يوم مرصود`;

  const sig = (role, nm) => `<div><div class="role">${role}</div><div class="nm">${esc(nm || '')}</div><div class="ln">التوقيع: ..................</div></div>`;
  const sigs = `<div class="sigs">${sig(G().officer, cfg.preparer)}${sig(G().deputy, cfg.deputy)}${sig(G().principal, cfg.principal)}</div>`;
  const foot = sigs + `<div class="foot"><span>أُعدّ بتاريخ ${new Date().toLocaleDateString('en-CA').replace(/-/g,'/')}${cfg.preparer ? ' — ' + esc(cfg.preparer) : ''}</span><span>جميع الحقوق محفوظة © ${COPYRIGHT}</span></div>`;
  if(!list.length || !recN){
    return `<article class="sheet"><h1>${title}</h1><p class="sub">${sub}</p><div class="nodata">${!list.length ? 'لا توجد فصول مسجلة بعد.' : 'لا يوجد غياب مرصود في هذه الفترة.'}</div>${foot}</article>`;
  }

  const stats = list.map(c => {
    let abs = 0, max = 0; const per = {};
    rec.forEach(k => { const v = +((state.days[k].entries || {})[c.id]) || 0; per[k] = v; abs += v; if(v > max) max = v; });
    const sd = (+c.count||0) * recN;
    return { c, abs, max, per, sd, rate: sd ? 1 - abs/sd : null };
  });
  const TA = stats.reduce((s,x) => s + x.abs, 0), TS = stats.reduce((s,x) => s + (+x.c.count||0), 0), TSD = stats.reduce((s,x) => s + x.sd, 0);
  const TR = TSD ? 1 - TA/TSD : null;

  // donut by grade
  const PAL = ['#1A9BEF','#F2B705','#5AD45A','#F4432C','#9B5DE5','#00B8A9','#FF8A3D','#E0457B','#8A8F98'];
  const groups = [];
  list.forEach(c => { const key = c.grade + ' ' + c.stage; let g = groups.find(x => x.key === key); if(!g){ g = {key, label: key, value:0}; groups.push(g); } });
  stats.forEach(s => { groups.find(g => g.key === s.c.grade + ' ' + s.c.stage).value += s.abs; });
  groups.forEach((g,i) => g.color = PAL[i % PAL.length]);

  // bar data
  let barItems, barCap;
  if(r.type === 'daily'){
    barItems = [...stats].sort((x,y) => y.abs - x.abs).slice(0, 12).map(s => ({label: `${s.c.grade} ${s.c.stage === 'متوسط' ? 'م' : 'ب'}/${s.c.section}`, value: s.abs}));
    barCap = 'الغياب حسب الفصل (الأعلى)';
  } else {
    barItems = rec.map(k => { const d = parse(k); return {label: r.type === 'weekly' ? dayName(d) : pad(d.getDate()), value: stats.reduce((s,x) => s + x.per[k], 0)}; });
    barCap = r.type === 'weekly' ? 'الغياب اليومي خلال الأسبوع' : 'الغياب اليومي خلال الشهر';
  }

  const legend = groups.map(g => `<div class="it"><span class="dot" style="background:${g.color}"></span><span>${esc(g.label)}</span><span class="v"><b>${fmtN(g.value)}</b><small>${TA ? Math.round(g.value/TA*100) : 0}٪</small></span></div>`).join('');
  const charts = `<div class="charts">
    <figure><figcaption>توزيع الغياب حسب الصف</figcaption><div class="donut">${donutSVG(groups, TA, recN > 1 ? 'حالة غياب' : G().oneAbsent)}</div><div class="legend">${legend}</div></figure>
    <figure><figcaption>${barCap}</figcaption>${barsSVG(barItems, r.type === 'daily' || r.type === 'weekly')}</figure>
  </div>`;

  const badAbs = (v, base) => base && v/base >= HIGH;
  const rateTd = rate => {
    if(rate == null) return `<td class="na">—</td>`;
    const p = Math.round(rate*1000)/10, bad = p < 90;
    return `<td class="rate ${bad ? 'bad' : ''}"><div class="rin"><b>${p}%</b><span class="rbarx"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></span></div></td>`;
  };
  const numTd = (v, bad, cls='') => `<td class="${cls} ${v === 0 ? 'zero' : ''} ${bad ? 'bad' : ''}">${fmtN(v)}</td>`;

  let thead, rows = '', total;
  if(r.type === 'daily'){
    thead = `<tr><th>م</th><th>الفصل</th><th>عدد ${G().students}<small>${G().student}</small></th><th>${G().presentNom}<small>${G().student}</small></th><th>${G().absentsNom}<small>${G().student}</small></th><th>نسبة الحضور</th></tr>`;
    stats.forEach((s,i) => { const n = +s.c.count||0; rows += `<tr><td class="idx">${i+1}</td><td class="name">${esc(clsLabel(s.c))}</td><td class="days">${fmtN(n)}</td>${numTd(n - s.abs, false)}${numTd(s.abs, badAbs(s.abs, n))}${rateTd(s.rate)}</tr>`; });
    total = `<tr class="total"><td></td><td class="name">الإجمالي</td><td>${fmtN(TS)}</td><td>${fmtN(TS - TA)}</td><td>${fmtN(TA)}</td>${rateTd(TR)}</tr>`;
  } else if(r.type === 'weekly'){
    const dh = keys.map(k => `<th>${dayName(parse(k))}<small>${parse(k).getDate()}/${parse(k).getMonth()+1}</small></th>`).join('');
    thead = `<tr><th>م</th><th>الفصل</th><th>عدد ${G().students}<small>${G().student}</small></th>${dh}<th>مجموع الغياب<small>حالة</small></th><th>نسبة الحضور</th></tr>`;
    stats.forEach((s,i) => {
      const n = +s.c.count||0;
      const cells = keys.map(k => state.days[k] ? numTd(s.per[k], badAbs(s.per[k], n)) : `<td class="na">—</td>`).join('');
      rows += `<tr><td class="idx">${i+1}</td><td class="name">${esc(clsLabel(s.c))}</td><td class="days">${fmtN(n)}</td>${cells}${numTd(s.abs, badAbs(s.abs, s.sd))}${rateTd(s.rate)}</tr>`;
    });
    const dt = keys.map(k => state.days[k] ? `<td>${fmtN(stats.reduce((a,x) => a + x.per[k], 0))}</td>` : `<td class="na">—</td>`).join('');
    total = `<tr class="total"><td></td><td class="name">الإجمالي</td><td>${fmtN(TS)}</td>${dt}<td>${fmtN(TA)}</td>${rateTd(TR)}</tr>`;
  } else {
    thead = `<tr><th>م</th><th>الفصل</th><th>عدد ${G().students}<small>${G().student}</small></th><th>أيام الرصد<small>يوم</small></th><th>مجموع الغياب<small>حالة</small></th><th>متوسط الغياب<small>${G().student}/يوم</small></th><th>أعلى غياب<small>في يوم</small></th><th>نسبة الحضور</th></tr>`;
    stats.forEach((s,i) => {
      const n = +s.c.count||0, avg = Math.round(s.abs/recN*10)/10;
      rows += `<tr><td class="idx">${i+1}</td><td class="name">${esc(clsLabel(s.c))}</td><td>${fmtN(n)}</td><td class="days">${recN}</td>${numTd(s.abs, badAbs(s.abs, s.sd))}${numTd(avg, false)}${numTd(s.max, badAbs(s.max, n))}${rateTd(s.rate)}</tr>`;
    });
    total = `<tr class="total"><td></td><td class="name">الإجمالي</td><td>${fmtN(TS)}</td><td>${recN}</td><td>${fmtN(TA)}</td><td>${fmtN(Math.round(TA/recN*10)/10)}</td><td>—</td>${rateTd(TR)}</tr>`;
  }
  const note = `بالأحمر: نسبة غياب ١٠٪ فأكثر من الفصل، نسبة حضور أقل من ٩٠٪${r.type === 'daily' ? '' : ' · الأيام غير المرصودة (—) لا تدخل في الحساب'}.`;
  return `<article class="sheet"><h1>${title}</h1><p class="sub">${sub}</p>${charts}
    <div class="tcap">الملخص حسب الفصل</div>
    <table class="rt"><thead>${thead}</thead><tbody>${rows}${total}</tbody></table>
    <p class="note">${note}</p>${foot}</article>`;
}

function donutSVG(segs, total, label){
  const R = 66, C = 2*Math.PI*R, sum = segs.reduce((a,s) => a + s.value, 0), live = segs.filter(s => s.value > 0);
  let off = 0, rings = '';
  if(!sum) rings = `<circle r="${R}" cx="90" cy="90" fill="none" stroke="#e7eaed" stroke-width="15"/>`;
  else live.forEach(s => {
    const len = s.value/sum*C, gap = live.length > 1 ? 2.5 : 0;
    rings += `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${s.color}" stroke-width="15" stroke-dasharray="${Math.max(len-gap,.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;
    off += len;
  });
  return `<svg viewBox="0 0 180 180" width="190" height="190" role="img" aria-label="${fmtN(total)} ${label}">${rings}<text x="90" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="#1d2226" font-family="IBM Plex Sans Arabic,Tahoma,sans-serif">${fmtN(total)}</text><text x="90" y="114" text-anchor="middle" font-size="11" fill="#777" font-family="IBM Plex Sans Arabic,Tahoma,sans-serif">${label}</text></svg>`;
}
function niceStep(x){ if(x <= 1) return 1; const e = Math.pow(10, Math.floor(Math.log10(x))), f = x/e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }
function barsSVG(items, rotate){
  const W = 340, H = 260, pT = 16, pB = rotate ? 70 : 26, pL = 34, pR = 6, ch = H - pT - pB, cw = W - pL - pR;
  const step = niceStep(Math.max(1, ...items.map(i => i.value)) / 4), max = step*4;
  const n = Math.max(items.length, 1), slot = cw/n, bw = Math.max(4, Math.min(16, slot*0.55));
  const F = `font-family="IBM Plex Sans Arabic,Tahoma,sans-serif"`;
  let g = `<text x="${pL}" y="${pT-5}" font-size="8.5" fill="#999" text-anchor="end" ${F}>${G().student}</text>`;
  for(let t = 0; t <= 4; t++){ const y = pT + ch - ch*t/4; g += `<line x1="${pL}" x2="${W-pR}" y1="${y}" y2="${y}" stroke="${t ? '#e8ebee' : '#9aa3ab'}"/><text x="${pL-6}" y="${y+3.5}" font-size="9.5" fill="#777" text-anchor="end" ${F}>${fmtN(step*t)}</text>`; }
  items.forEach((it,i) => {
    const cx = W - pR - slot*(i + .5), h = max ? it.value/max*ch : 0, y = pT + ch - h;
    if(h > 0) g += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="${Math.min(bw/2, h/2)}" fill="#1A9BEF"/>`;
    if(n <= 16 && it.value) g += `<text x="${cx}" y="${y-4}" font-size="8.5" fill="#555" text-anchor="middle" ${F}>${fmtN(it.value)}</text>`;
    const ly = pT + ch + 12;
    g += rotate
      ? `<text x="${cx}" y="${ly}" font-size="9.5" fill="#444" text-anchor="end" transform="rotate(-55 ${cx} ${ly})" ${F}>${esc(it.label)}</text>`
      : (n <= 24 || i % 2 === 0 ? `<text x="${cx}" y="${ly}" font-size="8.5" fill="#555" text-anchor="middle" ${F}>${esc(it.label)}</text>` : '');
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="direction:ltr">${g}</svg>`;
}

/* ---------- backup ---------- */
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
async function backup(){
  const dl = state.downloads; if(!dl) return;
  const data = { app:'student-absence', version:1, exportedAt:new Date().toISOString(), cfg:clone(state.cfg), days:clone(state.days), roster:clone(state.roster || {}), actions:clone(state.actions || {}), refs:clone(state.refs || {}), noorm:clone(state.noorM || {}) };
  try{ await dl.save({filename:`absence-backup-${iso(new Date())}.json`, data: JSON.stringify(data, null, 1)}); lsSetRaw('lastBackup', today); toast('تم تنزيل النسخة الاحتياطية'); render(); }
  catch(e){ if(!e || e.code !== 'declined') toast('تعذّر تنزيل النسخة الاحتياطية.','err'); }
}
async function restore(file, btn){
  let data;
  try{ data = JSON.parse(await file.text()); }catch(e){ toast('الملف ليس نسخة احتياطية صالحة.','err'); return; }
  if(!data || data.app !== 'student-absence' || !data.cfg || !Array.isArray(data.cfg.classes) || typeof data.days !== 'object'){ toast('الملف ليس نسخة احتياطية من هذا التطبيق.','err'); return; }
  const cfg = Object.assign(clone(DEFAULT_CFG), data.cfg);
  cfg.classes = cfg.classes.filter(c => c && c.id && c.stage && c.grade).map(c => ({id:String(c.id), stage:String(c.stage), grade:String(c.grade), section:String(c.section ?? ''), count:Math.max(0, +c.count || 0)}));
  const days = Object.entries(data.days).filter(([k,v]) => DATE_RE.test(k) && v && typeof v.entries === 'object');
  if(data.roster && typeof data.roster === 'object'){ state.roster = clone(data.roster); await saveRoster(); }
  if(data.actions && typeof data.actions === 'object'){ state.actions = clone(data.actions); await saveActions(); }
  if(data.noorm && typeof data.noorm === 'object'){ state.noorM = Object.assign({files:[], days:'', red:5, min:3, unOnly:false}, clone(data.noorm)); await saveNoorM(); }
  if(data.refs && typeof data.refs === 'object'){ for(const r of Object.values(data.refs)) if(r && r.id) await saveRef(r); }
  if(state.mode === 'local'){
    state.cfg = cfg; days.forEach(([k,v]) => state.days[k] = v); lsSet('cfg', cfg); lsSet('days', state.days);
    state.dirty = false; toast(`تم استيراد ${cfg.classes.length} فصلًا و${days.length} يومًا`); onData(); return;
  }
  btn.disabled = true;
  const old = btn.innerHTML;
  if(!(await dbWrite(() => state.db.doc('config/main').set(clone(cfg))))){ btn.disabled = false; return; }
  let done = 0;
  for(const [k,v] of days){
    const body = { date:k, entries:v.entries, students:(v.students && typeof v.students === 'object') ? v.students : {}, total:+v.total || Object.values(v.entries).reduce((a,b) => a + (+b||0), 0), savedAt:v.savedAt || new Date().toISOString() };
    if(!(await dbWrite(() => state.db.doc('days/' + k).set(body)))){ toast(`توقف الاستيراد بعد ${done} يومًا. أعد المحاولة.`,'err'); break; }
    done++; if(btn.isConnected) btn.textContent = `جارٍ الاستيراد ${done}/${days.length}`;
  }
  if(btn.isConnected){ btn.disabled = false; btn.innerHTML = old; }
  state.dirty = false;
  if(done === days.length) toast(`تم استيراد ${cfg.classes.length} فصلًا و${done} يومًا`);
}

      if(!exists(stage, GRADES[g], letters[s])){ state.cfg.classes.push({id:newId(), stage, grade:GRADES[g], section:letters[s], count}); added++; }
    }
    if(!added){ toast('كل فصول هذه المرحلة موجودة مسبقًا.'); return; }
    if(await saveCfg()) toast(`تم إنشاء ${added} فصول`); return;
  }
  if(act === 'delcls'){
    if(!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent = 'تأكيد'; setTimeout(() => { if(t.isConnected){ t.classList.remove('armed'); t.textContent = 'حذف'; } }, 4000); return; }
    const id = t.closest('tr').dataset.cid; state.cfg.classes = state.cfg.classes.filter(c => c.id !== id);
    if(await saveCfg()) toast('تم حذف الفصل'); return;
  }
});

document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-wa]'); if(!a) return;
  const cid = a.dataset.wa, nm = a.dataset.wname, row = (state.regDraft[cid] || []).find(r => (r.name || '').trim() === nm) || {};
  a.href = waUrl(row.phone || phoneFor(cid, nm), waAbsentText(cid, nm, row.type));
}, true);
document.addEventListener('mousedown', e => { if(e.target && e.target.id === 'modalBg') closeModal(); if(e.target && e.target.id === 'dlgBg') closeDlg(); });
document.querySelector('.overlay').addEventListener('click', () => $('#shell').classList.remove('open'));
document.addEventListener('input', e => {
  const inp = e.target;
  if(inp.id === 'adQ'){ sb.adQ = inp.value; const pos = inp.selectionStart; render(); const n = $('#adQ'); if(n){ n.focus(); n.setSelectionRange(pos, pos); } return; }
  if(inp.id === 'refQ'){ state.refQ = inp.value; const q = normAr(inp.value); document.querySelectorAll('.acard[data-rid]').forEach(el => { el.style.display = !q || normAr(el.querySelector('.acard-h b').textContent).includes(q) ? '' : 'none'; }); return; }
  if(inp.id === 'rq'){ state.rq = inp.value; applyRq(); return; }
  if(inp.id === 'actQ'){ state.actQ = inp.value; const q = normAr(inp.value); document.querySelectorAll('.acard').forEach(el => { el.style.display = !q || normAr(el.querySelector('.acard-h b').textContent).includes(q) ? '' : 'none'; }); return; }
  if(inp.dataset && inp.dataset.rf && inp.closest('.reged')){
    const cid = inp.closest('.reged').dataset.cid, i = +inp.closest('[data-i]').dataset.i, f = inp.dataset.rf;
    const row = (state.regDraft[cid] || [])[i]; if(!row) return;
    row[f] = inp.value; state.regDirty = true;
    if(f === 'name'){ const ph = nameHistory(cid).get(inp.value.trim()); const pi = inp.closest('[data-i]').querySelector('[data-rf="phone"]'); if(ph && !row.phone){ row.phone = ph; pi.value = ph; } }
    refreshRegPreview(); return;
  }
  if(inp.closest && inp.closest('.stepper')){
    const tile = inp.closest('.tile'), c = state.cfg.classes.find(x => x.id === tile.dataset.id);
    let v = Math.floor(+inp.value || 0); v = Math.max(0, Math.min(+c.count || 999, v));
    state.draft[c.id] = v; state.dirty = true; refreshTile(tile); updateTally();
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if(el.id === 'entryDate'){
    if(!el.value) return;
    if(isDirty()){ el.value = state.entryDate; toast('احفظ غياب اليوم الحالي أولًا أو اضغط «تراجع».','err'); return; }
    state.entryDate = el.value; loadDraft(); render(); return;
  }
  if(el.closest && el.closest('.stepper')){ const tile = el.closest('.tile'); el.value = +state.draft[tile.dataset.id] || 0; return; }
  if(el.id === 'restoreFile'){ const f = el.files && el.files[0]; el.value = ''; if(f) restore(f, $('#restoreBtn')); return; }
  if(el.hasAttribute && el.hasAttribute('data-rchk')){
    const cid = state.modalCid; if(!cid) return;
    const name = el.closest('.rs').dataset.name, rows = state.regDraft[cid] = state.regDraft[cid] || [];
    const i = rows.findIndex(r => (r.name||'').trim() === name);
    if(el.checked && i < 0) rows.push(rosterRow(cid, name)); else if(!el.checked && i >= 0) rows.splice(i, 1);
    state.regDirty = true; renderModal(true); return;
  }
  if(el.id === 'nmFile'){ const fl = [...(el.files || [])]; el.value = ''; nmImport(fl); return; }
  if(el.id === 'stuMin' || el.id === 'stuUn'){ if(el.id === 'stuMin') state.stuMin = +el.value; else state.stuUn = el.checked; render(); return; }
  if(['cmpRed','cmpMin','cmpUn'].includes(el.id) || false){
    const cm = state.cmp; if(el.id === 'cmpRed') cm.red = +el.value || 5; if(el.id === 'cmpMin') cm.min = +el.value; if(el.id === 'cmpUn') cm.unOnly = el.checked;
    render(); return;
  }
  if(['nmDays','nmRed','nmMin','nmUn'].includes(el.id)){
    const nm = state.noorM; if(el.id === 'nmDays') nm.days = el.value ? Math.max(1, +el.value) : ''; if(el.id === 'nmRed') nm.red = +el.value || 5;
    if(el.id === 'nmMin') nm.min = +el.value; if(el.id === 'nmUn') nm.unOnly = el.checked;
    await saveNoorM(); render(); return;
  }
  if(el.id === 'rfCls'){ const dl = $('#rfNames'); if(dl) dl.innerHTML = namesFor(el.value).map(n => `<option value="${esc(n)}">`).join(''); return; }
  if(el.id === 'actDays' || el.id === 'actFrom'){
    if(el.id === 'actDays') state.cfg.schoolDays = Math.max(1, +el.value || 180); else state.cfg.actFrom = el.value;
    if(await saveCfg()) toast('تم الحفظ'); render(); return;
  }
  if(el.id === 'noorFile'){ const f = el.files && el.files[0]; el.value = ''; if(f) noorImport(f); return; }
  if(el.id === 'pCls'){ openPaste(el.value); return; }
  if(el.id === 'rLogo'){
    const f = el.files && el.files[0]; el.value = ''; if(!f) return;
    try{
      const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
      const sc = Math.min(1, 320 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      state.cfg.logo = cv.toDataURL('image/png');
      if(await saveCfg()){ toast('تم حفظ الشعار'); if(state.mode === 'db') render(); }
    }catch(err){ toast('تعذّر قراءة الصورة.','err'); }
    return;
  }
  if(el.id === 'rDate' && el.value){ state.rpt.date = el.value; render(); return; }
  if(el.id === 'rMonth' && el.value){ state.rpt.month = el.value; render(); return; }
  const tr = el.closest && el.closest('tr[data-cid]');
  if(tr && el.dataset.f){
    const c = state.cfg.classes.find(x => x.id === tr.dataset.cid); if(!c) return;
    const f = el.dataset.f;
    c[f] = f === 'count' ? Math.max(0, Math.floor(+el.value || 0)) : el.value.trim();
    if(await saveCfg()) toast('تم الحفظ');
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.closest && e.target.closest('.stepper')){
    const all = [...document.querySelectorAll('.stepper input')], i = all.indexOf(e.target);
    if(all[i+1]){ e.preventDefault(); all[i+1].focus(); all[i+1].select(); }
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && state.modalCid) closeModal(); });
document.addEventListener('focusin', e => { if(e.target.closest && e.target.closest('.stepper') && e.target.tagName === 'INPUT') e.target.select(); });
window.addEventListener('beforeunload', e => { if(isDirty()){ e.preventDefault(); e.returnValue = ''; } });

init();
</script>
</body>
</html>
